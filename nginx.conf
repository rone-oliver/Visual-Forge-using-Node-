server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name craftora.store www.craftora.store;

    # Path for Angular frontend files
    root /home/roneootan611/Visual-Forge-using-Node-/frontend/dist/frontend/browser;
    index index.html;

    # Serve Angular application (handles client-side routing)
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Reverse proxy for NestJS backend API
    location /api/ {
        # The trailing slash is important if no /api prefix is configured in the backend!
        proxy_pass http://localhost:5000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy for Socket.IO connections
    location /socket.io/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Optional: Gzip compression for faster load times
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
